name: Public repository safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: windows-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked files and history
        shell: pwsh
        run: ./scripts/Test-PublicRepository.ps1 -History

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            function_app/requirements.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10.0"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Test and lint Python
        run: |
          python -m pytest tests -q
          python -m ruff check function_app tests
          python -m mypy function_app/mdc_jira

      - name: Validate Terraform
        run: |
          terraform fmt -recursive -check
          terraform -chdir=infra init -backend=false -reconfigure
          terraform -chdir=infra validate
